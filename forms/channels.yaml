# =============================================================================
# Channels this bot serves, and EVERYTHING that governs each one
#
# This file is CONFIGURATION, not data. It lives in git, so a channel you set up
# locally is deployed by pushing. The server reads it at startup and makes the
# database match — there is no separate "apply" step and nothing to re-do after a
# redeploy.
#
# WHY THIS MATTERS ON THE PANEL: only /data survives a redeploy. Everything else is
# re-uploaded from git each time, and /data holds only runtime data (messages,
# reports, reactions, verdicts, weekly results). If a binding or a ladder were
# created by hand on the server, it would be lost or duplicated on the next upload.
# So the wiring lives HERE, and it is rebuilt automatically on every start.
#
# Check:  uv run dsbot channels-check
# Apply:  uv run dsbot channels-apply     (optional; startup does this anyway)
# Show:   uv run dsbot channels
#
# EACH ENTRY:
#   guild:          the server that CONTAINS the channel
#   channel:        the channel to monitor
#   form:           which YAML form from forms/ to parse there
#   rank_guild:     which server HOLDS the roles (leave out to use the channel's guild)
#   review_ladder:  which ladder decides who may approve, by its `key` in that guild
#   quota_ladder:   which ladder says who owes reports and how many, by its `key`
#   locale:         ru or en, defaults to ru
#   enabled:        false pauses the channel without deleting anything
#
# The two ladders are named PER CHANNEL on purpose. Two channels may read reports in
# the same server while ordering the same people differently, and one channel may have
# approvals but no quota, or a quota but no approvals.
#
# Ladders are read from forms/ladders/<key>.yaml and applied automatically. A channel
# that names a ladder which does not exist is a configuration error, reported loudly at
# startup rather than silently counting nobody.
#
# Leaving a channel OUT of this file does not delete it. Use `enabled: false` to pause
# and keep its history.
# =============================================================================

channels:
  # Test channel in the home server. No ladders yet: parsing and warnings only.
  - guild: 1209516013779943544
    channel: 1573045809774067812
    form: training_report

  # Instructors server: reports are read here, but the roles live in the same guild
  # here, so rank_guild is omitted. Both ladders are named explicitly.
  - guild: 1274460259661910149
