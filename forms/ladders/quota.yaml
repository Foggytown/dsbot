# =============================================================================
# QUOTA LADDER: who owes reports, and how many per week
#
# Answers ONE question: "how many reports must this person file per week?"
# Grants NO rights. The only data field on a tier here is `required_per_week`;
# there is no `capabilities` field, and `ladder-check` rejects the file if one
# appears, because who owes a report must never be able to approve one.
#
# Check:  uv run dsbot ladder-check --file forms/ladders/quota.yaml
# Apply:  startup does this from forms/channels.yaml; this command is for a
#         running bot without a restart.
#
# Someone holding several roles here gets the HIGHEST tier's number, never the sum.
#
# NOTE: `required_per_week` values below are PLACEHOLDERS. Set the real weekly
# norms before relying on the count.
# =============================================================================

key: quota
purpose: quota
name: Специализации — отчётность
guild_id: 1274402776696488108

tiers:
  # `ordinal` only decides which number wins when someone holds several roles.
  - key: high
    label: Старший инс +
    ordinal: 50
    roles: [1499842014525788270, 1274452329470361672]
    required_per_week: 2

  - key: nothing
    label: Исключение
    ordinal: 30
    roles: []
    required_per_week: 0

  - key: instructor
    label: Instructor
    ordinal: 10
    roles: []
    required_per_week: 3
