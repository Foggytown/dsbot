# =============================================================================
# The quota ladder: WHO OWES REPORTS
#
# Copy to forms/ladders/quota.yaml and apply:
#
#   uv run dsbot ladder-check --file forms/ladders/quota.yaml
#   uv run dsbot ladder-apply --file forms/ladders/quota.yaml
#   uv run dsbot roster-refresh --channel <id>
#   uv run dsbot quota-set --channel <id> --tier instructor --count 3
#
# -----------------------------------------------------------------------------
# WHY THIS IS SEPARATE FROM review.yaml
# -----------------------------------------------------------------------------
#
# These tiers carry NO capabilities on purpose. Filing a report does not grant the
# right to approve one, and the bot enforces that by asking for `review` explicitly
# when a reaction arrives. A person may appear in both ladders (a senior instructor who
# both reviews and reports); the two answers are simply independent.
#
# The tiers here decide the shape of the weekly table: everyone holding one of these
# roles is in it, including people with zero reports, who show as 0. That is why
# `roster-refresh` needs the Members intent.
#
# Quieter tiers simply have `capabilities: []` and are never listed in review.yaml.
# =============================================================================

key: quota
purpose: quota
name: Специализации — отчётность
guild_id: 1274460259661910149

tiers:
  # Ordinal only orders people in reports and logs; it grants nothing.
  - key: head_instructor
    label: Head Instructor
    ordinal: 50
    roles: []
    capabilities: []

  - key: senior_instructor
    label: Senior Instructor
    ordinal: 30
    roles: []
    capabilities: []

  - key: instructor
    label: Instructor
    ordinal: 10
    roles: []
    capabilities: []
